services:
  app:
    build:
      context: ./App
    container_name: docmosis-mailmerge-app
    ports:
      - "3000:3000"
    environment:
      DOCMOSIS_URL: http://docmosis:8080
      DOCMOSIS_TEMPLATE: mailmerge-template.docx
      OUTPUT_DIRECTORY: /app/output
    volumes:
      - app-output:/app/output
    depends_on:
      docmosis:
        condition: service_healthy

  docmosis:
    build:
      context: ./Docmosis/Build
      dockerfile: Dockerfile
    container_name: docmosis-test
    ports:
      - "8080:8080"
    volumes:
      - ./Docmosis/Release/Templates:/home/docmosis/templates:ro
      - docmosis-workingarea:/home/docmosis/workingarea
    environment:
      DOCMOSIS_OFFICEDIR: /opt/libreoffice
      DOCMOSIS_TEMPLATESDIR: templates
      DOCMOSIS_WORKINGDIR: workingarea
      DOCMOSIS_KEY: ${DOCMOSIS_KEY}
      DOCMOSIS_SITE: ${DOCMOSIS_SITE}
      DOCMOSIS_ADMINPW: ${DOCMOSIS_ADMINPW}
      LANG: C.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s

volumes:
  app-output:
  docmosis-workingarea:
